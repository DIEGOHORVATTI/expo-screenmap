<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f232c"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.3" fill="#ffffff" fill-opacity=".09"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <g id="phone">
      <rect width="58" height="100" rx="12" fill="#151821" stroke="#3a4050" stroke-width="3"/>
      <rect x="20" y="7" width="18" height="4" rx="2" fill="#3a4050"/>
      <rect x="9" y="22" width="30" height="6" rx="3" fill="#e5e7eb" fill-opacity=".85"/>
      <rect x="9" y="34" width="40" height="4" rx="2" fill="#64748b"/>
      <rect x="9" y="43" width="34" height="4" rx="2" fill="#64748b"/>
      <rect x="9" y="56" width="40" height="16" rx="4" fill="#232836"/>
      <rect x="9" y="80" width="40" height="10" rx="5" fill="#f97316"/>
    </g>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#dots)"/>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M90 104 C122 104 128 72 158 72" stroke="url(#accent)" marker-end="url(#arrow)"/>
    <path d="M90 150 C122 150 128 182 158 182" stroke="#94a3b8" stroke-dasharray="2 9" marker-end="url(#arrow-dim)"/>
  </g>
  <use href="#phone" x="26" y="78"/>
  <rect x="24.5" y="76.5" width="61" height="103" rx="13.5" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <use href="#phone" x="172" y="22"/>
